  pocketeer_internal_app_services.Template:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      planned_income:
        type: number
      planned_work_time:
        $ref: '#/definitions/time.Duration'
      updated_at:
