  pocketeer_internal_app_services.Project:
    properties:
      actual_deadline:
        type: string
      actual_income:
        type: number
      actual_work_time:
        $ref: '#/definitions/time.Duration'
      created_at:
        type: string
      description:
        type: string
      finished_at:
        type: string
      id:
        type: integer
      name:
        type: string
      planned_deadline:
        type: string
      planned_income:
        type: number
      planned_work_time:
        $ref: '#/definitions/time.Duration'
      started_at:
        type: string
      state:
        $ref: '#/definitions/pocketeer_internal_platform_database_models.ProjectState'
      updated_at:
        type: string
    type: object
  pocketeer_internal_app_services.ProjectActualMetricsRequest:
    properties:
      actual_deadline:
        type: string
      actual_income:
        minimum: 0
        type: number
      actual_work_time:
