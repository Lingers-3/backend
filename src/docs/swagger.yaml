    type: object
  pocketeer_internal_app_services.ProjectPlanUpdateRequest:
    properties:
      planned_deadline:
        type: string
      planned_income:
        minimum: 0
        type: number
      planned_work_time:
        minimum: 0
        type: integer
    type: object
  pocketeer_internal_app_services.ProjectUpdateRequest:
    properties:
      description:
        maxLength: 512
        type: string
      name:
        maxLength: 256
        minLength: 1
        type: string
    type: object
  pocketeer_internal_app_services.ResourceReservation:
    properties:
      id:
        type: integer
      item_description:
        description: 'NOTE(pencelheimer): For convenience'
