    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    - 1
    - 1000
    - 1000000
    - 1000000000
    format: int64
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
externalDocs:
  description: OpenAPI Specification
  url: https://swagger.io/resources/open-api/
host: localhost:3000
info:
  contact: {}
  description: Inventory management system API
  title: Pocketeer API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Handle Auth0 OAuth2 callback with PKCE code exchange
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State parameter
        in: query
        name: state
        required: true
        type: string
      - description: Error code if auth failed
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary Redirect to application
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "403":
          description: Email not verified
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      summary: OAuth callback
      tags:
      - auth
  /auth/login:
    get:
      description: Redirect to Auth0 login page with PKCE flow
      parameters:
      - description: Post-login redirect URI
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      responses:
        "307":
          description: Temporary Redirect to Auth0
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      summary: Initiate login
      tags:
      - auth
  /auth/post-login:
    post:
      consumes:
      - application/json
      description: Create new user or restore soft-deleted user after Auth0 authentication
      parameters:
      - description: User Auth0 Data
        in: body
        name: user
        required: true
        schema:
          properties:
            email:
              type: string
            email_verified:
              type: boolean
            sub:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "403":
          description: Email not verified
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      summary: Post-login callback
      tags:
      - auth
  /item-types:
    get:
      consumes:
      - application/json
      description: Get a list of all item types belonging to the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pocketeer_internal_app_services.ItemType'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      security:
      - BearerAuth: []
      summary: List all item types
      tags:
      - item-types
    post:
      consumes:
      - application/json
      description: Create a new item type with specified properties
      parameters:
      - description: Item Type Creation Request
        in: body
        name: item_type
        required: true
        schema:
          $ref: '#/definitions/pocketeer_internal_app_services.ItemTypeCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pocketeer_internal_app_services.ItemType'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      security:
      - BearerAuth: []
      summary: Create a new item type
      tags:
      - item-types
  /item-types/{id}:
    delete:
      consumes:
      - application/json
      description: Soft or hard delete an item type. Use ?force=true for hard delete
      parameters:
      - description: Item Type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Force hard delete
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/delivery_http_handlers.ItemTypeDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      security:
      - BearerAuth: []
      summary: Delete item type
      tags:
      - item-types
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific item type
      parameters:
      - description: Item Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pocketeer_internal_app_services.ItemType'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      security:
      - BearerAuth: []
      summary: Get item type by ID
      tags:
      - item-types
    patch:
      consumes:
      - application/json
      description: Update an existing item type belonging to the authenticated user.
        Set picture_id to null to remove the picture.
      parameters:
      - description: Item Type ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item type update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/pocketeer_internal_app_services.ItemTypeUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pocketeer_internal_app_services.ItemType'
        "400":
          description: Invalid request payload
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "404":
          description: Item type or picture not found
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/echo.HTTPError'
      security:
      - BearerAuth: []
      summary: Update an item type
      tags:
      - item-types
  /item-types/full:
    get:
      consumes:
      - application/json
      description: Get a complete list of all item types with nested items and tags
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/pocketeer_internal_app_services.ItemTypeFull'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/echo.HTTPError'
        "500":
          description: Internal Server Error
