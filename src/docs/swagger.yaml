        type: string
      created_at:
        type: string
      default_quantity:
        type: number
      description:
        type: string
      display_measurement_unit:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/pocketeer_internal_app_services.ItemFull'
        type: array
      name:
        type: string
      picture_hash:
        type: string
      picture_id:
        type: integer
      shortage_threshold:
        type: number
      tags:
        items:
          $ref: '#/definitions/pocketeer_internal_app_services.Tag'
        type: array
      updated_at:
        type: string
    type: object
  pocketeer_internal_app_services.ItemTypeUpdateRequest:
    properties:
      base_measurement_unit:
        maxLength: 256
        type: string
      default_quantity:
        maximum: 1000000
        minimum: 0
        type: number
      description:
        maxLength: 512
        type: string
      display_measurement_unit:
        maxLength: 256
        type: string
      name:
        maxLength: 256
        type: string
      picture_id:
        $ref: '#/definitions/nullable.Nullable-uint'
      restore:
        description: true = restore soft-deleted item
        type: boolean
      shortage_threshold:
        maximum: 1000000
        minimum: 0
        type: number
      tag_ids:
        items:
          type: integer
        type: array
    type: object
  pocketeer_internal_app_services.ItemUpdateRequest:
    properties:
      description:
        maxLength: 512
        type: string
      display_measurement_unit:
        maxLength: 256
        type: string
      expiration_date:
        type: string
      purchase_price:
        maximum: 1000000
        minimum: 0
        type: number
      quantity:
        maximum: 1000000
        minimum: 0
        type: number
      tag_ids:
