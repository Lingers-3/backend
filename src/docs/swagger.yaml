      planned_work_time:
        minimum: 0
        type: integer
    type: object
  pocketeer_internal_app_services.UpdateReservationRequest:
    properties:
      reserved:
        type: number
      used:
        minimum: 0
        type: number
    type: object
  pocketeer_internal_app_services.UpdateResourceUsageRequest:
    properties:
      used_quantity:
        minimum: 0
        type: number
