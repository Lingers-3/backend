basePath: /api
definitions:
  delivery_http_handlers.ItemDeleteResponse:
    properties:
      hard:
        description: false = soft delete
        type: boolean
    type: object
  delivery_http_handlers.ItemTypeDeleteResponse:
    properties:
      hard:
        description: false = soft delete
        type: boolean
    type: object
  delivery_http_handlers.UpdatePasswordRequest:
    properties:
      newPassword:
        description: 'TODO(noatu): why camel case?'
        type: string
    type: object
  delivery_http_handlers.User:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      nickname:
        type: string
      picture:
        type: string
      sub:
        type: string
    type: object
  echo.HTTPError:
    properties:
      message: {}
    type: object
  nullable.Nullable-uint:
    additionalProperties:
      type: integer
    type: object
  pocketeer_internal_app_services.ActiveResourceItemRequest:
    properties:
      item_id:
        type: integer
      reserved:
        type: number
      used:
        minimum: 0
        type: number
    required:
    - item_id
    - reserved
    type: object
  pocketeer_internal_app_services.AddActiveResourceRequest:
    properties:
      item_type_id:
        type: integer
      resource_type:
        enum:
        - Consumable
        - Instrument
        type: string
      resources:
        items:
          $ref: '#/definitions/pocketeer_internal_app_services.ActiveResourceItemRequest'
        minItems: 1
        type: array
    required:
    - item_type_id
    - resource_type
    - resources
    type: object
  pocketeer_internal_app_services.AddPlannedResourceRequest:
    properties:
      item_type_id:
        type: integer
      planned_quantity:
        type: number
      resource_type:
        enum:
        - Consumable
        - Instrument
        type: string
    required:
    - item_type_id
    - planned_quantity
    - resource_type
    type: object
  pocketeer_internal_app_services.AddReservationRequest:
    properties:
      item_id:
        type: integer
      reserved:
        type: number
      used:
        minimum: 0
        type: number
    required:
    - item_id
    - reserved
    type: object
  pocketeer_internal_app_services.CancelProjectRequest:
    properties:
      return_items_to_inventory:
        type: boolean
    type: object
  pocketeer_internal_app_services.CompleteProjectRequest:
    properties:
      actual_revenue:
        minimum: 0
        type: number
      finalize_inventory:
        description: 'NOTE(pencelheimer): If true, remaining reserved but unused items
          are returned'
        type: boolean
    type: object
  pocketeer_internal_app_services.CreateTagRequest:
    properties:
      color:
        type: string
      name:
        maxLength: 256
        type: string
      target_id:
        type: integer
      target_type:
        enum:
        - item
        - item_type
        type: string
    required:
    - name
    type: object
  pocketeer_internal_app_services.Item:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      display_measurement_unit:
        type: string
      expiration_date:
        type: string
      id:
        type: integer
      item_type_id:
        type: integer
      purchase_price:
        type: number
      quantity:
        type: number
      reserved_quantity:
        type: number
      tag_ids:
        items:
          type: integer
        type: array
      updated_at:
        type: string
    type: object
  pocketeer_internal_app_services.ItemCreateRequest:
    properties:
      description:
        maxLength: 512
        type: string
      display_measurement_unit:
        maxLength: 256
        type: string
      expiration_date:
        type: string
      item_type_id:
        type: integer
      purchase_price:
        maximum: 1000000
        minimum: 0
        type: number
      quantity:
        maximum: 1000000
        minimum: 0
        type: number
      tag_ids:
        items:
          type: integer
        type: array
    required:
    - item_type_id
    type: object
  pocketeer_internal_app_services.ItemFull:
    properties:
      created_at:
        type: string
      description:
        type: string
      display_measurement_unit:
        type: string
      expiration_date:
        type: string
      id:
        type: integer
      purchase_price:
        type: number
      quantity:
        type: number
      reserved_quantity:
        type: number
      tags:
        items:
          $ref: '#/definitions/pocketeer_internal_app_services.Tag'
        type: array
      updated_at:
        type: string
    type: object
  pocketeer_internal_app_services.ItemType:
    properties:
      base_measurement_unit:
        type: string
      created_at:
        type: string
      default_quantity:
        type: number
      deleted_at:
        type: string
      description:
        type: string
      display_measurement_unit:
        type: string
      id:
        type: integer
      item_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      picture_hash:
        type: string
      picture_id:
        type: integer
      shortage_threshold:
        type: number
      tag_ids:
        items:
          type: integer
        type: array
      updated_at:
        type: string
    type: object
  pocketeer_internal_app_services.ItemTypeCreateRequest:
    properties:
      base_measurement_unit:
        maxLength: 256
        type: string
      default_quantity:
        maximum: 1000000
        minimum: 0
        type: number
      description:
        maxLength: 512
        type: string
      display_measurement_unit:
        maxLength: 256
        type: string
      name:
        maxLength: 256
        type: string
      picture_id:
        type: integer
      shortage_threshold:
        maximum: 1000000
        minimum: 0
        type: number
      tag_ids:
        items:
          type: integer
        type: array
