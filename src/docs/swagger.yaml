  pocketeer_internal_app_services.TemplateFromProjectRequest:
    properties:
      name:
        maxLength: 256
        minLength: 3
        type: string
    required:
    - name
    type: object
  pocketeer_internal_app_services.TemplateFull:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      planned_income:
        type: number
